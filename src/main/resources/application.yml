spring:
  application:
    name: GestionarCliente
  datasource:
    url: jdbc:h2:mem:clientes;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI}
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
